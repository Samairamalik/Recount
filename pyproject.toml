[project]
name = "recount"
version = "0.2.0"
description = "Deterministic verification of numeric claims in LLM-generated reports"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "duckdb>=1.1",
  "pydantic>=2.8",
  "typer>=0.12",
  "rich>=13",
  "jinja2>=3.1",
  "pyyaml>=6",
  "google-genai>=1.0",
]

[project.scripts]
recount = "recount.cli:app"

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11", "pip-audit>=2.7", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recount"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert in tests is fine

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
