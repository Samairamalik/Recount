# Olist semantic config, F-3 alias-on variant (docs/benchmark.md changelog 6). Differs from
# olist_metrics.yml only in the two commented-out "overall" aliases being enabled.
dataset: spike/data/orders.parquet
time_column: order_date
tolerance_rule: half_ulp
entities:
  state:
    column: state
    aliases:
      Sao Paulo: SP
      Rio de Janeiro: RJ
      Minas Gerais: MG
      Rio Grande do Sul: RS
      Parana: PR
      Santa Catarina: SC
metrics:
  revenue:
    agg: sum
    column: revenue
    aliases: [revenue, total revenue, gross revenue]
    round: 2            # SUM over DOUBLE varies ~3.5e-07 with row order (spike d6)
    polarity: higher_is_better
  orders:
    agg: count
    # F-3 opt-in ON: identical to olist_metrics.yml with the two "overall" aliases enabled.
    aliases: [orders, order volume, order count, overall, overall performance]
    polarity: higher_is_better
  avg_order_value:
    agg: avg
    column: revenue
    aliases: [average order value]
    polarity: higher_is_better
  avg_delivery_days:
    agg: avg
    column: delivery_days   # AVG skips the 2 NULL rows
    aliases: [average delivery time, average delivery times, average delivery turnaround, delivery time]
    polarity: lower_is_better
  order_share_pct:
    agg: share
    aliases: [order share, share of total orders, share of total order volume, percentage of orders]
    polarity: higher_is_better
