name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv python install 3.12
      - run: uv sync --all-groups
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
      - run: uv run recount bench --write-readme   # replay mode: recorded responses, no key (C3)
      - run: uv run recount bench --config tests/fixtures/olist_metrics.alias-on.yml --out bench/results/latest.alias-on.json   # F-3 opt-in row
      - run: git diff --exit-code README.md bench/results/latest.json bench/results/latest.alias-on.json   # committed numbers must reproduce (C4)
      - run: uv run pip-audit   # enforcing: a vulnerable dependency fails CI (T8)
